name: Build WeekFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create WeekFlow Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/weekflow/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          rootProject.name = "WeekFlow"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.weekflow.app'
            compileSdk 35

            defaultConfig {
              applicationId "com.weekflow.app"
              minSdk 24
              targetSdk 35
              versionCode 4
              versionName "1.4"
            }

            buildTypes {
              debug {
                minifyEnabled false
              }
              release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }

            buildFeatures {
              buildConfig true
            }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # No custom rules needed for debug / simple release.
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="true"
              android:label="WeekFlow"
              android:icon="@android:drawable/sym_def_app_icon"
              android:theme="@style/Theme.WeekFlow">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="Theme.WeekFlow" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:statusBarColor">#071326</item>
              <item name="android:navigationBarColor">#071326</item>
              <item name="android:windowBackground">#071326</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/backup_rules.xml <<'EOF'
          <full-backup-content />
          EOF

          cat > app/src/main/res/xml/data_extraction_rules.xml <<'EOF'
          <data-extraction-rules />
          EOF

          cat > app/src/main/java/com/weekflow/app/MainActivity.java <<'EOF'
          package com.weekflow.app;

          import android.annotation.SuppressLint;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              getWindow().setStatusBarColor(Color.parseColor("#071326"));
              getWindow().setNavigationBarColor(Color.parseColor("#071326"));
              WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
              controller.setAppearanceLightStatusBars(false);
              controller.setAppearanceLightNavigationBars(false);

              webView = new WebView(this);
              setContentView(webView);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setLoadWithOverviewMode(true);
              settings.setUseWideViewPort(true);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);

              webView.setBackgroundColor(Color.parseColor("#071326"));
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          EOF

          export WEEKFLOW_HTML_GZ=''
          printf '%s' "$WEEKFLOW_HTML_GZ" | base64 -d | gzip -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q "Tu semana" app/src/main/assets/index.html
          grep -q "DÍA VIVO" app/src/main/assets/index.html
          grep -q "Jardín" app/src/main/assets/index.html
          echo "WeekFlow v4 project created successfully."

      - name: Build WeekFlow APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload WeekFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
