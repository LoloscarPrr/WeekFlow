        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/weekflow/app app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "WeekFlow"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.weekflow.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.weekflow.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 3
                  versionName '0.3-core-dia-vivo'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="WeekFlow"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/weekflow/app/MainActivity.java <<'EOF'
          package com.weekflow.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  w.setStatusBarColor(Color.rgb(7,17,31));
                  w.setNavigationBarColor(Color.rgb(7,17,31));
                  w.getDecorView().setSystemUiVisibility(0);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(7,17,31));
                  webView.setOnApplyWindowInsetsListener((v, insets) -> {
                      v.setPadding(0, insets.getSystemWindowInsetTop(), 0, insets.getSystemWindowInsetBottom());
                      return insets;
                  });
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDefaultTextEncodingName("UTF-8");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          printf '%s' "$WEEKFLOW_HTML_GZ" | base64 -d | gzip -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q "DÍA VIVO" app/src/main/assets/index.html
          grep -q "Jardín" app/src/main/assets/index.html
          echo "WeekFlow v3 project created successfully."

      - name: Build WeekFlow APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload WeekFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
