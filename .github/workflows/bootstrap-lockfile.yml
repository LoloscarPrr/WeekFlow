name: Bootstrap npm lockfile (temporary)
on:
  push:
    branches:
      - perf/wf-notify-005-idempotent-sync
    paths:
      - .github/workflows/bootstrap-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'

      - name: Generate lockfile for current main
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo 'No lockfile changes'; exit 0; }
          git commit -m "chore(build): lock npm dependencies for current main (WF-CORE-008)"
          git push origin HEAD:perf/wf-notify-005-idempotent-sync
