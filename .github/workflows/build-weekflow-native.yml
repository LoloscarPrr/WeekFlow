name: Build WeekFlow Native APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/build-weekflow-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read WeekFlow version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WeekFlow v$VERSION"

      - name: Install dependencies
        run: npm install

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Create WeekFlow Android and splash assets
        shell: bash
        run: |
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw

          # Launcher icon
          S=1024
          im=Image.new("RGBA",(S,S),(6,16,31,255))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((70,70,954,954), radius=210, fill=(11,35,71,255), outline=(23,58,112,255), width=18)
          pts1=[(170,610),(250,400),(355,390),(470,650),(600,650),(700,420),(820,420)]
          pts2=[(170,610),(250,450),(355,445),(470,700),(600,700),(700,485),(820,485)]
          d.line(pts2, fill=(47,128,255,255), width=90, joint="curve")
          d.line(pts1, fill=(87,162,255,255), width=64, joint="curve")
          d.ellipse((760,170,860,270), fill=(253,181,47,255))
          im.save("assets/icon.png")
          im.save("assets/adaptive-icon.png")

          # Splash mark: transparent W + sun, without the white/default Android panel.
          splash=Image.new("RGBA",(600,600),(0,0,0,0))
          s=ImageDraw.Draw(splash)
          p1=[(95,360),(155,230),(225,225),(300,385),(370,385),(430,245),(505,245)]
          p2=[(95,360),(155,265),(225,260),(300,420),(370,420),(430,285),(505,285)]
          s.line(p2, fill=(47,128,255,255), width=54, joint="curve")
          s.line(p1, fill=(87,162,255,255), width=38, joint="curve")
          s.ellipse((445,100,515,170), fill=(253,181,47,255))
          splash.save("assets/splash-icon.png")
          PY

      - name: Patch Expo icon config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const j = JSON.parse(fs.readFileSync(p,'utf8'));
          j.expo = j.expo || {};
          j.expo.icon = './assets/icon.png';
          j.expo.android = j.expo.android || {};
          j.expo.android.adaptiveIcon = {
            foregroundImage: './assets/adaptive-icon.png',
            backgroundColor: '#06101F'
          };
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          cp "$APK" "output/WeekFlow-v${VERSION}-Standalone.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-v${{ steps.version.outputs.version }}-Standalone-APK
          path: output/WeekFlow-v${{ steps.version.outputs.version }}-Standalone.apk
          if-no-files-found: error
