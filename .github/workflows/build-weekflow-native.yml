name: Build WeekFlow Native APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "assets/brand/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/build-weekflow-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read WeekFlow version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WeekFlow Alpha v$VERSION"

      - name: Assign monotonic Android versionCode
        id: android_version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const configPath = 'app.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isInteger(runNumber) || runNumber <= 0) throw new Error(`Invalid GITHUB_RUN_NUMBER: ${process.env.GITHUB_RUN_NUMBER}`);
          const versionCode = 100000 + runNumber;
          config.expo.android = config.expo.android || {};
          config.expo.android.versionCode = versionCode;
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_code=${versionCode}\n`);
          console.log(`Android versionCode: ${versionCode}`);
          NODE

      - name: Verify update configuration
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          node <<'NODE'
          const config = require('./app.json').expo;
          const expectedVersionCode = Number(process.env.EXPECTED_VERSION_CODE);
          if (config.android?.package !== 'com.weekflow.app') throw new Error(`Unexpected Android package: ${config.android?.package}`);
          if (config.android?.versionCode !== expectedVersionCode) throw new Error(`Unexpected versionCode: ${config.android?.versionCode}`);
          console.log(`Update config OK: ${config.android.package} / versionCode ${config.android.versionCode}`);
          NODE

      - name: Install dependencies
        run: npm install

      - name: Run release quality gate
        run: npm run quality

      - name: Install brand conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp python3-pil

      - name: Prepare Android assets from locked official artwork
        shell: bash
        run: |
          set -euo pipefail
          dwebp assets/brand/weekflow-splash.webp -o assets/splash-official.png
          python3 - <<'PY'
          from PIL import Image
          icon = Image.open('assets/brand/weekflow-icon.webp').convert('RGB')
          icon.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png')
          icon.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/adaptive-icon.png')
          splash = Image.open('assets/splash-official.png')
          print('Official icon source:', icon.size)
          print('Official splash source:', splash.size)
          PY

      - name: Keep visible alpha label synchronized
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./app.json').expo.version;
          const path = 'app/index.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(/Build \d+\.\d+\.\d+/g, `Alpha ${version}`);
          source = source.replace(/UX \/ Semana v\d+\.\d+\.\d+/g, `UX / Semana · Alpha ${version}`);
          source = source.replace(/Alpha \d+\.\d+\.\d+/g, `Alpha ${version}`);
          fs.writeFileSync(path, source);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore permanent WeekFlow signing key
        shell: bash
        env:
          WEEKFLOW_KEYSTORE_BASE64: ${{ secrets.WEEKFLOW_KEYSTORE_BASE64 }}
          WEEKFLOW_KEYSTORE_PASSWORD: ${{ secrets.WEEKFLOW_KEYSTORE_PASSWORD }}
          WEEKFLOW_KEY_ALIAS: ${{ secrets.WEEKFLOW_KEY_ALIAS }}
          WEEKFLOW_KEY_PASSWORD: ${{ secrets.WEEKFLOW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WEEKFLOW_KEYSTORE_BASE64"
          test -n "$WEEKFLOW_KEYSTORE_PASSWORD"
          test -n "$WEEKFLOW_KEY_ALIAS"
          test -n "$WEEKFLOW_KEY_PASSWORD"
          printf '%s' "$WEEKFLOW_KEYSTORE_BASE64" | base64 --decode > android/app/weekflow-release.jks
          chmod 600 android/app/weekflow-release.jks
          keytool -list -keystore android/app/weekflow-release.jks -storepass "$WEEKFLOW_KEYSTORE_PASSWORD" -alias "$WEEKFLOW_KEY_ALIAS" >/dev/null
          echo "Permanent WeekFlow signing key restored."

      - name: Configure generated release signing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          const lines = fs.readFileSync(path, 'utf8').split('\n');
          const signingIndex = lines.findIndex((line) => line.includes('signingConfigs {'));
          const buildTypesIndex = lines.findIndex((line) => line.includes('buildTypes {'));
          if (signingIndex < 0 || buildTypesIndex < 0 || buildTypesIndex <= signingIndex) throw new Error('Could not locate Android signing/buildTypes blocks.');
          lines.splice(buildTypesIndex - 1, 0,
            '        release {',
            '            storeFile file(System.getenv("WEEKFLOW_KEYSTORE_PATH"))',
            '            storePassword System.getenv("WEEKFLOW_KEYSTORE_PASSWORD")',
            '            keyAlias System.getenv("WEEKFLOW_KEY_ALIAS")',
            '            keyPassword System.getenv("WEEKFLOW_KEY_PASSWORD")',
            '        }'
          );
          const nextBuildTypesIndex = lines.findIndex((line) => line.includes('buildTypes {'));
          const releaseIndex = lines.findIndex((line, index) => index > nextBuildTypesIndex && line.trim() === 'release {');
          if (releaseIndex < 0) throw new Error('Could not locate release build type.');
          let replaced = false;
          for (let i = releaseIndex + 1; i < lines.length && i < releaseIndex + 30; i += 1) {
            if (lines[i].includes('signingConfig signingConfigs.debug')) {
              lines[i] = lines[i].replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release');
              replaced = true;
              break;
            }
          }
          if (!replaced) throw new Error('Could not switch release build to WeekFlow signing config.');
          fs.writeFileSync(path, lines.join('\n'));
          NODE

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
          WEEKFLOW_KEYSTORE_PATH: ${{ github.workspace }}/android/app/weekflow-release.jks
          WEEKFLOW_KEYSTORE_PASSWORD: ${{ secrets.WEEKFLOW_KEYSTORE_PASSWORD }}
          WEEKFLOW_KEY_ALIAS: ${{ secrets.WEEKFLOW_KEY_ALIAS }}
          WEEKFLOW_KEY_PASSWORD: ${{ secrets.WEEKFLOW_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "No release APK found"; exit 1; fi
          cp "$APK" "output/WeekFlow-Alpha-v${VERSION}-Standalone.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-Alpha-v${{ steps.version.outputs.version }}-Standalone-APK
          path: output/WeekFlow-Alpha-v${{ steps.version.outputs.version }}-Standalone.apk
          if-no-files-found: error
