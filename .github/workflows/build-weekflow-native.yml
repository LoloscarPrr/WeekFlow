name: Build WeekFlow Native APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "assets/brand/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/build-weekflow-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read WeekFlow version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WeekFlow Alpha v$VERSION"

      - name: Install dependencies
        run: npm install

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Prepare Android assets from locked official artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          icon_source = Path('assets/brand/weekflow-icon.webp')
          splash_source = Path('assets/brand/weekflow-splash.webp')
          if not icon_source.exists() or not splash_source.exists():
              raise RuntimeError('Missing locked WeekFlow brand assets.')

          # No redraw, recolor, background removal or reinterpretation is allowed here.
          # Only platform-required resizing/format conversion is performed.
          icon = Image.open(icon_source).convert('RGB')
          icon.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png')
          icon.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/adaptive-icon.png')

          splash = Image.open(splash_source).convert('RGB')
          splash.save('assets/splash-official.png')
          PY

      - name: Keep visible alpha label synchronized
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./app.json').expo.version;
          const path = 'app/index.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(/Build \d+\.\d+\.\d+/g, `Alpha ${version}`);
          source = source.replace(/UX \/ Semana v\d+\.\d+\.\d+/g, `UX / Semana · Alpha ${version}`);
          source = source.replace(/Alpha \d+\.\d+\.\d+/g, `Alpha ${version}`);
          fs.writeFileSync(path, source);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          cp "$APK" "output/WeekFlow-Alpha-v${VERSION}-Standalone.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-Alpha-v${{ steps.version.outputs.version }}-Standalone-APK
          path: output/WeekFlow-Alpha-v${{ steps.version.outputs.version }}-Standalone.apk
          if-no-files-found: error
