name: Build WeekFlow Native APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/build-weekflow-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read WeekFlow version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WeekFlow v$VERSION"

      - name: Install dependencies
        run: npm install

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Materialize canonical WeekFlow logo
        shell: bash
        run: |
          mkdir -p assets
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/brand/canonicalIcon.ts', 'utf8');
          const match = source.match(/WEEKFLOW_ICON_BASE64\s*=\s*`([^`]+)`/s);
          if (!match) throw new Error('Canonical WeekFlow logo was not found.');
          fs.writeFileSync('assets/weekflow-canonical.png', Buffer.from(match[1], 'base64'));
          NODE

      - name: Prepare launcher, adaptive and splash assets from canonical logo
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image

          src = Image.open('assets/weekflow-canonical.png').convert('RGBA')
          bg = src.getpixel((0, 0))[:3]

          # Launcher: exact approved artwork, only resized to Android's recommended canvas.
          launcher = src.resize((1024, 1024), Image.Resampling.LANCZOS)
          launcher.save('assets/icon.png')

          # Adaptive/splash: remove only the canonical flat navy background.
          mark = src.copy()
          pixels = mark.load()
          for y in range(mark.height):
              for x in range(mark.width):
                  r, g, b, a = pixels[x, y]
                  if abs(r-bg[0]) <= 2 and abs(g-bg[1]) <= 2 and abs(b-bg[2]) <= 2:
                      pixels[x, y] = (r, g, b, 0)

          bbox = mark.getbbox()
          if not bbox:
              raise RuntimeError('Canonical WeekFlow mark is empty.')
          mark = mark.crop(bbox)

          canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          scale = min(620 / mark.width, 620 / mark.height)
          size = (round(mark.width * scale), round(mark.height * scale))
          mark = mark.resize(size, Image.Resampling.LANCZOS)
          canvas.alpha_composite(mark, ((1024-size[0])//2, (1024-size[1])//2))
          canvas.save('assets/adaptive-icon.png')
          canvas.save('assets/splash-icon.png')
          PY

      - name: Keep visible build label synchronized
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./app.json').expo.version;
          const path = 'app/index.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(/Build \d+\.\d+\.\d+/g, `Build ${version}`);
          source = source.replace(/v\d+\.\d+\.\d+/g, `v${version}`);
          fs.writeFileSync(path, source);
          NODE

      - name: Patch Expo canonical icon config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const j = JSON.parse(fs.readFileSync(p,'utf8'));
          j.expo = j.expo || {};
          j.expo.icon = './assets/icon.png';
          j.expo.android = j.expo.android || {};
          j.expo.android.adaptiveIcon = {
            foregroundImage: './assets/adaptive-icon.png',
            backgroundColor: '#071326'
          };
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          cp "$APK" "output/WeekFlow-v${VERSION}-Standalone.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-v${{ steps.version.outputs.version }}-Standalone-APK
          path: output/WeekFlow-v${{ steps.version.outputs.version }}-Standalone.apk
          if-no-files-found: error
