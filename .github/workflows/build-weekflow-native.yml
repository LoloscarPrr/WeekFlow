name: Build WeekFlow Native APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "assets/brand/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/build-weekflow-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read WeekFlow version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WeekFlow Alpha v$VERSION"

      - name: Install dependencies
        run: npm install

      - name: Install brand conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp python3-pil

      - name: Prepare Android assets from locked official artwork
        shell: bash
        run: |
          set -euo pipefail

          # The approved brand assets are stored as base64 source so the
          # GitHub text API cannot corrupt the binary files again.
          node <<'NODE'
          const fs = require('fs');

          function extract(path, constant, output) {
            const source = fs.readFileSync(path, 'utf8');
            const marker = `export const ${constant} = `;
            const start = source.indexOf(marker);
            if (start === -1) throw new Error(`Could not find ${constant} in ${path}`);

            const valueStart = start + marker.length;
            const quote = source[valueStart];
            if (quote !== '`' && quote !== '"' && quote !== "'") {
              throw new Error(`Unexpected quote for ${constant} in ${path}`);
            }

            const valueEnd = source.indexOf(quote + ';', valueStart + 1);
            if (valueEnd === -1) throw new Error(`Could not read ${constant} from ${path}`);

            const base64 = source.slice(valueStart + 1, valueEnd).replace(/\s+/g, '');
            fs.writeFileSync(output, Buffer.from(base64, 'base64'));
          }

          extract('src/brand/canonicalIcon.ts', 'WEEKFLOW_ICON_BASE64', '/tmp/weekflow-icon.png');
          extract('src/brand/canonicalSplash.ts', 'WEEKFLOW_SPLASH_WEBP_BASE64', '/tmp/weekflow-splash.webp');
          NODE

          # Splash source is the approved lockup artwork; conversion only.
          dwebp /tmp/weekflow-splash.webp -o assets/splash-official.png

          # Android requires fixed launcher canvases. Resize only: no redraw,
          # recolor, background removal or reinterpretation.
          python3 - <<'PY'
          from PIL import Image

          icon = Image.open('/tmp/weekflow-icon.png').convert('RGB')
          icon.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png')
          icon.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/adaptive-icon.png')

          splash = Image.open('assets/splash-official.png')
          print('Official icon source:', icon.size)
          print('Official splash source:', splash.size)
          PY

      - name: Keep visible alpha label synchronized
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./app.json').expo.version;
          const path = 'app/index.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(/Build \d+\.\d+\.\d+/g, `Alpha ${version}`);
          source = source.replace(/UX \/ Semana v\d+\.\d+\.\d+/g, `UX / Semana · Alpha ${version}`);
          source = source.replace(/Alpha \d+\.\d+\.\d+/g, `Alpha ${version}`);
          fs.writeFileSync(path, source);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          cp "$APK" "output/WeekFlow-Alpha-v${VERSION}-Standalone.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekFlow-Alpha-v${{ steps.version.outputs.version }}-Standalone-APK
          path: output/WeekFlow-Alpha-v${{ steps.version.outputs.version }}-Standalone.apk
          if-no-files-found: error
