name: Quality

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and regression tests
        run: npm run quality

      - name: Smoke-test Android Metro bundle
        run: npx expo export --platform android --output-dir "${RUNNER_TEMP}/weekflow-bundle-smoke" --clear
