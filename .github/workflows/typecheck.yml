name: Typecheck

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npx tsc --noEmit
